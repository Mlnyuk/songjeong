<head>
<meta charset="UTF-8" />

<style>
  :root {
    --primary: #e8590c;
    --primary-light: #fff0e6;
    --bg: #faf8f5;
    --card: #ffffff;
    --text: #2b2b2b;
    --text-sub: #777777;
    --border: #ececec;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { font-size: 16px; }

  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }

  /* ---------- Header ---------- */
  header {
    padding: 32px 0 20px;
    text-align: center;
  }

  .badge {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  header h1 .accent { color: var(--primary); }

  header p {
    margin-top: 8px;
    font-size: 0.9rem;
    color: var(--text-sub);
  }

  /* ---------- Filter buttons ---------- */
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-sub);
    font-size: 0.875rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  /* ---------- Place cards ---------- */
  .count-info {
    font-size: 0.8rem;
    color: var(--text-sub);
    margin-bottom: 10px;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .place-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .place-name {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .cat-tag {
    flex: 0 0 auto;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .cat-tour    { background: #e7f5ff; color: #1971c2; }
  .cat-food    { background: #fff0e6; color: #e8590c; }
  .cat-cafe    { background: #f3f0ff; color: #7048e8; }
  .cat-market  { background: #ebfbee; color: #2f9e44; }

  .place-desc {
    margin-top: 8px;
    font-size: 0.875rem;
    color: var(--text-sub);
  }

  .place-loc {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--text-sub);
  }

  .detail-btn {
    margin-top: 14px;
    width: 100%;
    border: none;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 0.875rem;
    font-weight: 700;
    padding: 10px 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .detail-btn:active { background: #ffe1cc; }

  .empty-msg {
    text-align: center;
    color: var(--text-sub);
    font-size: 0.875rem;
    padding: 40px 0;
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 32px;
    animation: slideUp 0.25s ease;
    max-height: 85vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: #ddd;
    border-radius: 999px;
    margin: 0 auto 16px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .modal-header h2 {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.4px;
  }

  .modal-close {
    border: none;
    background: #f1f1f1;
    color: #666;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .modal-cat { margin-top: 6px; }

  .info-list {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .info-item {
    display: flex;
    gap: 10px;
    font-size: 0.875rem;
  }

  .info-icon { flex: 0 0 auto; }

  .info-item .label {
    font-weight: 700;
    display: block;
    margin-bottom: 2px;
  }

  .info-item .value { color: var(--text-sub); }

  .map-btn {
    margin-top: 22px;
    width: 100%;
    border: none;
    background: #fae100;
    color: #3c1e1e;
    font-size: 0.95rem;
    font-weight: 800;
    padding: 14px 0;
    border-radius: 12px;
    cursor: pointer;
  }
  .map-btn:active { background: #e8d000; }

  /* ---------- Course section ---------- */
  .course-section { margin-top: 40px; }

  .course-section h2 {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .course-section .sub {
    font-size: 0.8rem;
    color: var(--text-sub);
    margin: 4px 0 14px;
  }

  .course-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
  }

  .course-card .time {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 800;
    color: #fff;
    background: var(--primary);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .course-card h3 {
    margin-top: 10px;
    font-size: 1rem;
    font-weight: 700;
  }

  .course-steps {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 0.825rem;
    color: var(--text-sub);
  }

  .course-steps .step {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    color: var(--text);
  }

  .course-steps .arrow { color: #bbb; }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 0.75rem;
    color: #aaa;
  }

  @media (min-width: 480px) {
    .modal-overlay { align-items: center; padding: 0 16px; }
    .modal { border-radius: 20px; }
  }
</style>
</head>

      category: "tour",
      desc: "옛 철도관사 마을 골목에 그려진 벽화길. 천천히 걷기 좋은 코스.",
      location: "광주송정역 도보 8분",
      address: "광주 광산구 송정동 철도관사마을 일대",
      hours: "상시 개방 (야간 조명 없음, 낮 방문 추천)",
      features: "일제강점기 철도관사 건물 / 기찻길 테마 벽화 / 골목 포토 스팟",
      recommend: "사진 찍으며 동네 산책을 즐기는 분, 근대 건축 애호가",
      mapQuery: "송정 철도관사마을"
    },
    {
      id: 14,
      name: "떡갈비 명가 본점",
      category: "food",
      desc: "송정 떡갈비 골목에서도 줄 서는 집. 떡갈비 정식에 뼛국 무한 리필.",
      location: "광주송정역 도보 7분",
      address: "광주 광산구 광산로29번길 인근",
      hours: "매일 10:30 ~ 21:00 (브레이크타임 15:00~17:00)",
      features: "숯불 향 가득한 수제 떡갈비 / 뼛국·반찬 리필 / 단체석 보유",
      recommend: "광주 떡갈비를 처음 먹어보는 분, 점심 정식 식사",
      mapQuery: "송정떡갈비"
    }
  ];

  const courses = [
    {
      time: "30분 코스",
      title: "후다닥 간식 코스",
      steps: ["광주송정역", "1913송정역시장 간식", "역 복귀"]
    },
    {
      time: "1시간 코스",
      title: "커피 & 시장 산책 코스",
      steps: ["광주송정역", "로스터리 송정브루잉", "1913송정역시장", "역 복귀"]
    },
    {
      time: "2시간 코스",
      title: "송정 제대로 맛보기 코스",
      steps: ["광주송정역", "송정 떡갈비 골목 식사", "1913송정역시장", "카페 송정연가", "역 복귀"]
    }
  ];

  // ---------- Filters ----------
  const filtersEl = document.getElementById("filters");
  const cardListEl = document.getElementById("cardList");
  const countInfoEl = document.getElementById("countInfo");
  let activeCategory = "all";

  function renderFilters() {
    filtersEl.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (cat.id === activeCategory ? " active" : "");
      btn.textContent = cat.label;
      btn.addEventListener("click", () => {
        activeCategory = cat.id;
        renderFilters();
        renderCards();
      });
      filtersEl.appendChild(btn);
    });
  }

  // ---------- Cards ----------
  function renderCards() {
    const list = activeCategory === "all"
      ? places
      : places.filter(p => p.category === activeCategory);

    countInfoEl.textContent = `총 ${list.length}곳`;
    cardListEl.innerHTML = "";

    if (list.length === 0) {
      cardListEl.innerHTML = '<p class="empty-msg">해당 카테고리에 등록된 장소가 없습니다.</p>';
      return;
    }

    list.forEach(place => {
      const card = document.createElement("article");
      card.className = "place-card";
      card.innerHTML = `
        <div class="card-top">
          <h3 class="place-name">${place.name}</h3>
          <span class="cat-tag cat-${place.category}">${CAT_LABEL[place.category]}</span>
        </div>
        <p class="place-desc">${place.desc}</p>
        <p class="place-loc">📍 ${place.location}</p>
      `;
      const btn = document.createElement("button");
      btn.className = "detail-btn";
      btn.textContent = "자세히 보기";
      btn.addEventListener("click", () => openModal(place));
      card.appendChild(btn);
      cardListEl.appendChild(card);
    });
  }

  // ---------- Modal ----------
  const overlay = document.getElementById("modalOverlay");
  const mapBtn = document.getElementById("modalMapBtn");
  let currentMapQuery = "";

  function openModal(place) {
    document.getElementById("modalTitle").textContent = place.name;
    document.getElementById("modalCat").innerHTML =
      `<span class="cat-tag cat-${place.category}">${CAT_LABEL[place.category]}</span>`;
    document.getElementById("modalAddress").textContent = place.address;
    document.getElementById("modalHours").textContent = place.hours;
    document.getElementById("modalFeatures").textContent = place.features;
    document.getElementById("modalRecommend").textContent = place.recommend;
    currentMapQuery = place.mapQuery;
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    overlay.classList.remove("open");
    document.body.style.overflow = "";
  }

  document.getElementById("modalClose").addEventListener("click", closeModal);
  overlay.addEventListener("click", e => {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });

  mapBtn.addEventListener("click", () => {
    const url = "https://map.kakao.com/?q=" + encodeURIComponent(currentMapQuery);
    window.open(url, "_blank");
  });

  // ---------- Courses ----------
  function renderCourses() {
    const courseListEl = document.getElementById("courseList");
    courses.forEach(course => {
      const card = document.createElement("div");
      card.className = "course-card";
      const stepsHtml = course.steps
        .map(s => `<span class="step">${s}</span>`)
        .join('<span class="arrow">→</span>');
      card.innerHTML = `
        <span class="time">${course.time}</span>
        <h3>${course.title}</h3>
        <div class="course-steps">${stepsHtml}</div>
      `;
      courseListEl.appendChild(card);
    });
  }

  // ---------- Init ----------
  renderFilters();
  renderCards();
  renderCourses();
</script>
</body>
</html>
