apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: songjeong
resources:
  - deploy/k8s/namespace.yaml
  - deploy/k8s/deployment.yaml
  - deploy/k8s/service.yaml
configMapGenerator:
  - name: songjeong-html
    files:
      - site/index.html
  - name: songjeong-nginx
    files:
      - default.conf=nginx.conf
